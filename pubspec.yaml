name: hey_teacher_app
description: Platform for English teachers in Uruguay
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.4
  
  # State Management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0

  # Motion & polish
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  skeletonizer: ^2.1.3
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.2.2
  qr_flutter: ^4.1.0
  gal: ^2.3.1
  http: ^1.2.0
  
  # PDF/Image in-app preview
  webview_flutter: ^4.10.0

  # Google Sign-In & Calendar API
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Sign in with Apple (required by App Store guideline 4.8)
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # Local Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    ##- assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/hey_teacher_logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/hey_teacher_logo.jpeg"
  remove_alpha_ios: true
